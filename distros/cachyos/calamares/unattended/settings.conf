#
# Configuration file for Calamares
---
modules-search: [ local ]

instances:

- id:       online
  module:   packages
  config:   packages_online.conf

- id:       online
  module:   welcome
  config:   welcome_online.conf
  autoProceed: true

- id:       before-online
  module:   shellprocess
  config:   shellprocess-before-online.conf

- id:       modify_mk_hook
  module:   shellprocess
  config:   shellprocess_modify_mk_hook.conf

- id:       reset_mk_hook
  module:   shellprocess
  config:   shellprocess_reset_mk_hook.conf

- id:       initialize_pacman
  module:   shellprocess
  config:   shellprocess_initialize_pacman.conf

- id:       bootloader
  module:   packagechooser
  config:   packagechooser_bootloader.conf
  autoProceed: true

- id:       desktop
  module:   packagechooser
  config:   packagechooser_desktop.conf
  autoProceed: true

- id:       enable_ufw
  module:   shellprocess
  config:   shellprocess_enable_ufw.conf

- id:       greetd
  module:   shellprocess
  config:   shellprocess_greetd.conf

- id:       btrfs_snapshot
  module:   shellprocess
  config:   shellprocess_btrfs_snapshot.conf

- id:       cleanup_calamares
  module:   shellprocess
  config:   shellprocess_cleanup_calamares.conf


- id:       ""
  module:   locale
  config:   locale.conf
  autoProceed: true

- id:       ""
  module:   keyboard
  config:   keyboard.conf
  autoProceed: true

- id:       ""
  module:   partition
  config:   partition.conf
  autoProceed: true

- id:       ""
  module:   netinstall
  config:   netinstall.conf
  autoProceed: true

- id:       ""
  module:   users
  config:   users.conf
  autoProceed: true

- id:       ""
  module:   summary
  config:   summary.conf
  autoProceed: true

 
- id:       ""
  module:   finished
  config:   finished.conf
  autoProceed: true

sequence:
- show:
  - welcome@online
  - locale
  - keyboard
  - packagechooser@bootloader
  - partition
  - packagechooser@desktop
  - netinstall
  - users
  - summary
- exec:
  - partition
  - zfs
  - mount
  - shellprocess@modify_mk_hook
  - shellprocess@initialize_pacman
  - shellprocess@before-online
  - pacstrap
  - machineid
  - users
  - locale
  - keyboard
  - localecfg
  - chwd
  - packages@online
  - luksbootkeyfile
  - luksopenswaphookcfg
  - fstab
  - plymouthcfg
  - zfshostid
  - initcpiocfg
  - initcpio
  - networkcfg
  - displaymanager
  - hwclock
  - grubcfg
  - bootloader
  - shellprocess@reset_mk_hook
  - services-systemd
  - shellprocess
  - shellprocess@enable_ufw
  - shellprocess@greetd
  - shellprocess@btrfs_snapshot
  - shellprocess@cleanup_calamares
  - umount
- show:
  - finished

branding: cachyos

prompt-install: false

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: true
